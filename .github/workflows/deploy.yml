---
name: Deploy

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hosted runners intermittently fail crate downloads ("curl failed"), which is
# expensive when it kills a release build.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build and release
    runs-on: ${{ matrix.os }}
    needs: test
    permissions:
      contents: write

    strategy:
      # One architecture failing must not cancel the others, or a release ends
      # up with an arbitrary subset of its artifacts.
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: linux
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get the release version from the tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: deploy-${{ matrix.target }}

      - run: sudo apt -y install musl-dev musl-tools
        if: matrix.build == 'linux'

      - name: Install `cargo-generate-rpm` and `cargo-deb`
        if: matrix.build == 'linux'
        run: |
          cargo install --locked cargo-generate-rpm
          cargo install --locked cargo-deb

      - name: Build Linux
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
        if: matrix.build == 'linux'

      - name: Generate RPM and DEB
        if: matrix.build == 'linux'
        run: |
          ls -alR target/${{ matrix.target }}/release/epazote
          # Create target/release directory if it doesn't exist (it might not if only cross-compiled)
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/epazote ./target/release/epazote
          strip -s ./target/release/epazote

          # RPM
          cargo generate-rpm
          ls -alR target/generate-rpm
          RPM_PATH=$(find target/generate-rpm/ -name "*.rpm" -print -quit)
          echo "RPM_ASSET=$RPM_PATH" >> $GITHUB_ENV

          # DEB: --no-build because the binary is already built above, and
          # --target so cargo-deb stamps the right package architecture
          # (amd64 vs arm64) instead of guessing from the host.
          cargo deb --no-build --target ${{ matrix.target }}

          # Find the generated deb
          # It usually goes to target/{target}/debian/
          ls -alR target
          DEB_PATH=$(find target -name "*.deb" -print -quit)
          echo "DEB_ASSET=$DEB_PATH" >> $GITHUB_ENV

      - name: Build
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
        if: matrix.build != 'linux'

      - name: Build archive
        shell: bash
        run: |
          binary_name="epazote"

          dirname="$binary_name-${{ env.VERSION }}-${{ matrix.target }}"
          mkdir "$dirname"
          mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"

          tar -czf "$dirname.tar.gz" "$dirname"
          echo "ASSET=$dirname.tar.gz" >> $GITHUB_ENV

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |-
            ${{ env.ASSET }}
            ${{ env.RPM_ASSET }}
            ${{ env.DEB_ASSET }}

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - run: cargo publish --locked --token ${CRATES_TOKEN}
        env:
          CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
