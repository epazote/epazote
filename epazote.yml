---
services:
  myip:
    url: https://www.myip.country
    every: 30s
    max_bytes: 1024
    headers:
      user-agent: sopas
    expect:
      status: 200
      if_not:
        cmd: echo -n "myip.country down"

  ssh-vault:
    url: http://www.ssh-vault.com
    every: 10s
    expect:
      status: 301

  google:
    url: https://google.com
    every: 10s
    expect:
      status: 301

  my-command:
    test: false
    every: 5m
    # how long the check command may run before it is killed (default 5s)
    timeout: 10s
    expect:
      status: 0
      if_not:
        # recovery commands get their own budget (default 300s)
        timeout: 15m
        cmd:
